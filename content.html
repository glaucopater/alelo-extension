<div id="alelo-overlay">
  <div id="alelo-modal" role="dialog" aria-modal="true">
    <button id="alelo-close" aria-label="Close">×</button>
    <div id="alelo-header">
      <div>
        <h2>Alelo</h2>
        <p id="alelo-extension-version" class="alelo-version" aria-label="Extension version"></p>
      </div>
      <div id="alelo-header-actions">
        <button type="button" id="alelo-run-btn" class="alelo-btn alelo-icon-btn" aria-label="Retry translation" title="Retry translation" disabled>↻</button>
        <button type="button" id="alelo-copy-btn" class="alelo-btn alelo-icon-btn" aria-label="Copy translation" title="Copy translation">⎘</button>
        <button type="button" id="alelo-tab-raw" class="alelo-btn alelo-icon-btn" aria-label="Raw JSON view" title="Raw JSON">{ }</button>
        <button type="button" id="alelo-history-btn" class="alelo-btn alelo-icon-btn" aria-label="History" title="History">⌛</button>
        <button type="button" id="alelo-settings-btn" class="alelo-btn alelo-icon-btn" aria-label="Settings" title="Settings">⚙</button>
        <span id="alelo-action-status" class="alelo-action-status"></span>
      </div>
    </div>

    <div id="alelo-history-panel" class="alelo-hidden">
      <div class="alelo-panel-header">
        <h3>History</h3>
        <button type="button" id="alelo-history-clear-btn" class="alelo-btn alelo-btn-small">Clear all</button>
      </div>
      <div id="alelo-history-list"></div>
      <p id="alelo-history-empty" class="alelo-history-empty alelo-hidden">No previous translations saved yet.</p>
    </div>

    <div id="alelo-settings-panel" class="alelo-hidden">
      <h3>Settings</h3>
      <label class="alelo-field">
        <span>API URL</span>
        <input type="url" id="alelo-config-api-url" placeholder="http://localhost:11434/api/chat" />
      </label>
      <label class="alelo-field">
        <span>Model</span>
        <input type="text" id="alelo-config-model" placeholder="gemma4:e2b" />
      </label>
      <label class="alelo-field">
        <span>Auth token (optional)</span>
        <input type="password" id="alelo-config-auth-token" placeholder="Leave empty if not required" autocomplete="off" />
      </label>

      <div class="alelo-field">
        <span>Favorite languages</span>
        <p class="alelo-field-hint">These appear in the right-click menu when you select text.</p>
        <p class="alelo-field-hint alelo-flag-attribution">
          Flag icons by <a href="https://flagpedia.net" target="_blank" rel="noopener noreferrer">Flagpedia.net</a>
        </p>
        <div id="alelo-favorites-list" class="alelo-favorites-list"></div>
        <div class="alelo-favorites-add">
          <div id="alelo-favorites-picker" class="alelo-lang-picker">
            <button
              type="button"
              id="alelo-favorites-picker-trigger"
              class="alelo-lang-picker-trigger alelo-select"
              aria-haspopup="listbox"
              aria-expanded="false"
            >
              <span class="alelo-lang-picker-value alelo-lang-picker-placeholder">Add a language…</span>
              <span class="alelo-lang-picker-chevron" aria-hidden="true">▾</span>
            </button>
            <ul id="alelo-favorites-picker-menu" class="alelo-lang-picker-menu alelo-hidden" role="listbox"></ul>
          </div>
          <button type="button" id="alelo-favorites-add-btn" class="alelo-btn alelo-btn-small">Add</button>
        </div>
        <div class="alelo-favorites-custom">
          <input type="text" id="alelo-favorites-custom-code" placeholder="Custom code (e.g. pt-BR)" />
          <input type="text" id="alelo-favorites-custom-label" placeholder="Custom label" />
          <button type="button" id="alelo-favorites-add-custom-btn" class="alelo-btn alelo-btn-small">Add custom</button>
        </div>
      </div>

      <div class="alelo-settings-actions">
        <button type="button" id="alelo-config-save-btn" class="alelo-btn alelo-btn-primary">Save</button>
        <span id="alelo-config-status"></span>
      </div>
    </div>

    <div id="alelo-context" class="alelo-context">
      <div id="alelo-target-lang" class="alelo-target-lang"></div>
      <div id="alelo-page-source" class="alelo-page-source"></div>
    </div>

    <div id="alelo-source-wrap" class="alelo-source-wrap">
      <div class="alelo-source-label">Source text</div>
      <div id="alelo-source-text" class="alelo-source-text"></div>
      <button type="button" id="alelo-source-expand-btn" class="alelo-btn alelo-btn-small alelo-hidden">Show more</button>
    </div>

    <div id="alelo-spinner" class="alelo-hidden" aria-label="Translating">
      <div class="alelo-spinner"></div>
    </div>

    <div id="alelo-error" class="alelo-error-panel alelo-hidden"></div>
    <div id="alelo-formatted" class="alelo-panel alelo-markdown"></div>
    <pre id="alelo-raw" class="alelo-panel alelo-hidden"></pre>
  </div>
</div>
